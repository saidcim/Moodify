name: Moodify Cycle

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:
    inputs:
      user_note:
        description: "Your request for this cycle"
        required: false
        default: ""
        type: string

concurrency:
  group: moodify-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: "."
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      PLAYLIST_NAME: "Moodify Mix"
      PLAYLIST_SIZE: "20"
      SPOTIFY_REDIRECT_URI: "http://127.0.0.1:5000/callback"
      USER_NOTE: ${{ github.event.inputs.user_note }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull state from the gist
        run: python gist_state.py pull
      - name: Run the full cycle
        run: python bot.py cycle
      - name: Push state back to the gist
        if: always()
        run: python gist_state.py push
      - name: Commit Excel history and dashboard data
        if: always()
        continue-on-error: true
        run: |
          git config user.name "moodify"
          git config user.email "actions@users.noreply.github.com"
          git add playlist_history_cycle_*.xlsx 2>/dev/null || true
          git add dashboard_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "cycle history [skip ci]"
          git push
